<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mock Test - NEET Saathi</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"><style>
body{margin:0}a{color:inherit;text-decoration:none}
.w{font-family:'Plus Jakarta Sans',sans-serif;color:#1B1B3A;background:#F1F2FB}
.dk{background:radial-gradient(circle at 78% 35%,rgba(139,92,246,.55),transparent 45%),radial-gradient(circle at 8% 95%,rgba(34,211,238,.2),transparent 40%),#0B1030;color:#fff}
.ct{max-width:1200px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.btn{min-height:48px;padding:0 24px;border-radius:14px;border:0;font:700 15px 'Plus Jakarta Sans',sans-serif;background:linear-gradient(135deg,#4F46E5,#8B5CF6);color:#fff;box-shadow:0 8px 24px rgba(79,70,229,.4)}
.gh{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,255,255,.35)}
.cd{background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(55,48,163,.12)}
.ch{display:inline-block;border-radius:20px;padding:4px 12px;font:700 12px 'Plus Jakarta Sans',sans-serif}.pc{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 14px 'Plus Jakarta Sans'}</style><style>
.nav a{margin-right:14px;font:700 14px 'Plus Jakarta Sans',sans-serif;color:#fff;opacity:.9}
.opt{display:flex;align-items:center;gap:14px;min-height:54px;padding:0 16px;border-radius:16px;background:#fff;box-shadow:0 4px 12px rgba(55,48,163,.08);font:700 16px 'Plus Jakarta Sans',sans-serif;cursor:pointer;border:2px solid transparent}
.opt.on{background:#EEF0FF;border-color:#4F46E5;color:#4F46E5}
.pc{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 14px 'Plus Jakarta Sans',sans-serif;border:0;background:#E6E8F6;color:#1B1B3A}
.pc.ans{background:#22A66E;color:#fff}.pc.nan{background:#B4540A;color:#fff}.pc.mk{background:#8B5CF6;color:#fff}.pc.cur{box-shadow:0 0 0 3px #fff,0 0 0 5px #4F46E5}
.g2{display:flex;gap:10px;flex-wrap:wrap}
select{min-height:48px;border-radius:14px;border:2px solid #E6E8F6;padding:0 14px;font:600 15px 'Plus Jakarta Sans',sans-serif;background:#fff;color:#1B1B3A}
.qi{width:100%;display:block;border-radius:12px;background:#fff}
</style></head>
<body>
<div class="w" style="min-height:900px">
<div class="dk" style="padding:14px 0"><div class="ct" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><a href="index.html" style="flex:1 1 200px"><b style="font:800 20px 'Plus Jakarta Sans'">NEET Saathi · CBT Mock Test</b></a><div class="nav"><a href="teacher.html">AI Teacher</a><a href="galti.html">Galti Notebook</a><a href="weak.html">Progress</a><a href="plan.html">Daily Plan</a></div><div id="timer" style="display:none;background:#fff;color:#4F46E5;border-radius:14px;padding:6px 16px;font:800 22px 'Plus Jakarta Sans'">00:00:00</div></div></div>
<div class="ct" style="padding-top:22px;padding-bottom:40px">
<div id="start" class="cd" style="max-width:560px;display:flex;flex-direction:column;gap:14px">
<h2 style="margin:0;font:800 24px 'Plus Jakarta Sans'">Test shuru karein</h2>
<div style="color:#5F6384;font-size:14px;line-height:1.5">Asli NEET paper ke questions. Sahi jawab par +4, galat par -1. Galat questions apne aap Galti Notebook me save ho jaate hain.</div>
<label style="font-weight:700;font-size:14px">Kaunsa paper?</label>
<select id="paper"><option value="2025">NEET 2025</option><option value="2019">NEET 2019</option><option value="2018">NEET 2018</option></select>
<label style="font-weight:700;font-size:14px">Kitna?</label>
<select id="scope"><option value="all">Poora paper (180 questions, 3 ghante)</option><option value="Physics">Sirf Physics (45 questions, 45 minute)</option><option value="Chemistry">Sirf Chemistry (45 questions, 45 minute)</option><option value="Botany">Sirf Botany (45 questions, 45 minute)</option><option value="Zoology">Sirf Zoology (45 questions, 45 minute)</option></select>
<div><button id="go" class="btn">Test shuru karein</button></div>
<div id="smsg" style="font-size:14px;color:#B4540A;min-height:18px"></div>
</div>
<div id="test" style="display:none;flex-wrap:wrap;gap:22px;align-items:flex-start">
<div style="flex:1 1 560px;display:flex;flex-direction:column;gap:14px;min-width:0">
<div id="subs" class="g2"></div>
<div class="cd" style="display:flex;flex-direction:column;gap:12px;padding:16px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b id="qno" style="font-size:15px;flex:1"></b><span id="qsub" class="ch" style="background:#EEF0FF;color:#4F46E5"></span><span class="ch" style="background:#E3F6EC;color:#17603F">+4 / -1</span></div><img id="qimg" class="qi" alt="Question"></div>
<div id="opts" style="display:flex;flex-direction:column;gap:10px"></div>
<div class="g2"><button id="prev" class="btn" style="min-height:44px;padding:0 18px;background:#fff;color:#4F46E5;box-shadow:inset 0 0 0 2px #4F46E5">Previous</button><button id="mark" class="btn" style="min-height:44px;padding:0 18px;background:#fff;color:#4F46E5;box-shadow:inset 0 0 0 2px #4F46E5">Mark for Review</button><button id="clr" class="btn" style="min-height:44px;padding:0 18px;background:#fff;color:#4F46E5;box-shadow:inset 0 0 0 2px #4F46E5">Clear Answer</button><button id="next" class="btn" style="min-height:44px">Save &amp; Next</button></div>
</div>
<aside style="flex:0 0 330px;max-width:100%;display:flex;flex-direction:column;gap:14px"><div class="cd" style="padding:16px"><b style="font-size:16px">Question Palette</b><div id="pal" style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0"></div><div style="display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px"><span><i style="display:inline-block;width:12px;height:12px;border-radius:4px;background:#22A66E"></i> Answered</span><span><i style="display:inline-block;width:12px;height:12px;border-radius:4px;background:#8B5CF6"></i> Marked</span><span><i style="display:inline-block;width:12px;height:12px;border-radius:4px;background:#B4540A"></i> Not answered</span><span><i style="display:inline-block;width:12px;height:12px;border-radius:4px;background:#E6E8F6"></i> Not visited</span></div></div><button id="submit" class="btn" style="min-height:52px;background:linear-gradient(135deg,#B4540A,#E0801F)">Submit Test</button></aside>
</div>
<div id="result" style="display:none;flex-direction:column;gap:18px;max-width:760px"></div>
</div></div>
<script>
var FILES={"2018":["neet2018.json"],"2019":["neet2019.json"],"2025":["neet2025a.json","neet2025b.json"]};
var GKEY="neetsathi_galti_v1";
var GAP=[1,3,7,15];
var DAY=86400000;
var S={qs:[],ans:[],vis:[],mk:[],cur:0,left:0,tid:null,paper:"",title:"",done:false};
function el(i){return document.getElementById(i);}
function E(tag,css,text){var n=document.createElement(tag);if(css){n.style.cssText=css;}if(text!==undefined&&text!==null){n.textContent=String(text);}return n;}
function fmt(t){var h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h<10?"0":"")+h+":"+(m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function loadPaper(y){
  var fs=FILES[y];
  return Promise.all(fs.map(function(f){return fetch(f).then(function(r){if(!r.ok){throw new Error(f);}return r.json();});})).then(function(arr){
    var qs=[];arr.forEach(function(d){qs=qs.concat(d.questions);});
    qs.sort(function(a,b){return a.n-b.n;});
    return {title:arr[0].title,qs:qs};
  });
}
el("go").onclick=function(){
  var y=el("paper").value,sc=el("scope").value;
  el("smsg").style.color="#5F6384";el("smsg").textContent="Questions load ho rahe hain...";
  el("go").disabled=true;
  loadPaper(y).then(function(p){
    var qs=p.qs.filter(function(q){return sc==="all"||q.s===sc;});
    if(!qs.length){throw new Error("empty");}
    S.qs=qs;S.paper=y;S.title=p.title;S.done=false;
    S.ans=qs.map(function(){return 0;});S.vis=qs.map(function(){return false;});S.mk=qs.map(function(){return false;});
    S.cur=0;S.left=(sc==="all"?180:45)*60;
    el("start").style.display="none";el("test").style.display="flex";el("timer").style.display="block";
    buildSubs();show(0);tick();
    S.tid=setInterval(tick,1000);
  }).catch(function(){
    el("smsg").style.color="#B4540A";el("smsg").textContent="Ye paper abhi load nahi ho paya. Questions ki file GitHub par upload hui hai ya nahi, ye check karein.";
    el("go").disabled=false;
  });
};
function tick(){
  if(S.done){return;}
  el("timer").textContent=fmt(Math.max(0,S.left));
  if(S.left<=0){finish(true);return;}
  S.left-=1;
}
function buildSubs(){
  var d=el("subs");d.innerHTML="";
  var seen={};
  S.qs.forEach(function(q,i){
    if(!seen[q.s]){seen[q.s]=1;
      var b=E("button","min-height:40px;padding:0 16px;background:#fff;color:#4F46E5;box-shadow:inset 0 0 0 2px #4F46E5",q.s);
      b.className="btn";b.onclick=function(){show(i);};d.appendChild(b);
    }
  });
}
function status(i){
  if(S.mk[i]){return "mk";}
  if(S.ans[i]){return "ans";}
  if(S.vis[i]){return "nan";}
  return "";
}
function drawPal(){
  var p=el("pal");p.innerHTML="";
  S.qs.forEach(function(q,i){
    var b=E("button",null,q.n);b.className="pc "+status(i)+(i===S.cur?" cur":"");
    b.onclick=function(){show(i);};p.appendChild(b);
  });
}
function show(i){
  S.cur=i;S.vis[i]=true;
  var q=S.qs[i];
  el("qno").textContent="Question "+(i+1)+" / "+S.qs.length+"  (Q."+q.n+")";
  el("qsub").textContent=q.s;
  el("qimg").src=q.img;
  var o=el("opts");o.innerHTML="";
  for(var k=1;k<=4;k++){(function(k){
    var d=E("div",null,null);d.className="opt"+(S.ans[i]===k?" on":"");
    d.appendChild(E("b",null,"("+k+")"));d.appendChild(E("span",null,"Option "+k));
    d.onclick=function(){S.ans[i]=(S.ans[i]===k?0:k);show(i);};
    o.appendChild(d);})(k);}
  el("mark").textContent=S.mk[i]?"Unmark Review":"Mark for Review";
  drawPal();
  window.scrollTo({top:0,behavior:"smooth"});
}
el("next").onclick=function(){if(S.cur<S.qs.length-1){show(S.cur+1);}else{drawPal();}};
el("prev").onclick=function(){if(S.cur>0){show(S.cur-1);}};
el("clr").onclick=function(){S.ans[S.cur]=0;show(S.cur);};
el("mark").onclick=function(){S.mk[S.cur]=!S.mk[S.cur];show(S.cur);};
el("submit").onclick=function(){
  var n=S.ans.filter(function(a){return a>0;}).length;
  if(window.confirm(S.qs.length+" me se "+n+" questions attempt kiye hain. Test submit karein?")){finish(false);}
};
function saveGalti(list){
  var items=[];
  try{var r=localStorage.getItem(GKEY);items=r?JSON.parse(r):[];if(!Array.isArray(items)){items=[];}}catch(e){items=[];}
  var added=0,now=Date.now();
  list.forEach(function(q){
    var ref="neet"+S.paper+"#"+q.n;
    if(items.some(function(x){return x.ref===ref;})){return;}
    var sub=(q.s==="Botany"||q.s==="Zoology")?"Biology":q.s;
    items.push({id:String(now)+q.n,subject:sub,q:"NEET "+S.paper+" ke Question "+q.n+" (mock test me galat hua)",why:"Mock test me galat attempt",created:now,stage:0,next:now+GAP[0]*DAY,ref:ref,paper:S.paper,qn:q.n});
    added++;
  });
  try{localStorage.setItem(GKEY,JSON.stringify(items));}catch(e){return -1;}
  return added;
}
function finish(auto){
  if(S.done){return;}
  S.done=true;clearInterval(S.tid);
  var tot={c:0,w:0,s:0},by={},wrong=[],skip=[],right=[];
  S.qs.forEach(function(q,i){
    var b=by[q.s]=by[q.s]||{c:0,w:0,s:0};
    var a=S.ans[i];
    if(!a){b.s++;tot.s++;skip.push(i);}
    else if(q.a&&q.a.indexOf(a)>=0){b.c++;tot.c++;right.push(i);}
    else{b.w++;tot.w++;wrong.push(i);}
  });
  var score=tot.c*4-tot.w;
  var added=saveGalti(wrong.map(function(i){return S.qs[i];}));
  el("test").style.display="none";el("timer").style.display="none";
  var r=el("result");r.style.display="flex";r.innerHTML="";
  var top=E("div","border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,#4F46E5,#8B5CF6);display:flex;flex-direction:column;gap:6px");
  top.appendChild(E("div","font:700 12px 'Plus Jakarta Sans';letter-spacing:.08em;opacity:.85",(auto?"TIME KHATAM":"RESULT")+" · "+S.title));
  top.appendChild(E("div","font:800 40px 'Plus Jakarta Sans'",score+" / "+(S.qs.length*4)));
  top.appendChild(E("div","font-size:15px","Sahi: "+tot.c+"  ·  Galat: "+tot.w+"  ·  Chhode: "+tot.s));
  r.appendChild(top);
  var note=E("div","border-radius:18px;padding:14px 16px;background:#EEF0FF;font-size:14px;line-height:1.5");
  note.textContent=(added>0?added+" galat question Galti Notebook me save ho gaye.":(tot.w?"Galat questions pehle se Galti Notebook me hain.":"Koi galat question nahi. Shabash!"));
  r.appendChild(note);
  var sc=E("div","display:flex;flex-direction:column;gap:8px");sc.className="cd";
  sc.appendChild(E("b","font-size:16px","Subject ke hisaab se"));
  Object.keys(by).forEach(function(k){
    var b=by[k];
    var row=E("div","display:flex;justify-content:space-between;font-size:14px;gap:10px");
    row.appendChild(E("span",null,k));
    row.appendChild(E("span","color:#5F6384","Sahi "+b.c+" · Galat "+b.w+" · Chhode "+b.s+" · Marks "+(b.c*4-b.w)));
    sc.appendChild(row);
  });
  r.appendChild(sc);
  var tabs=E("div","display:flex;gap:10px;flex-wrap:wrap");
  var list=E("div","display:flex;flex-direction:column;gap:14px");
  function showList(arr,title){
    list.innerHTML="";
    if(!arr.length){var e=E("div","color:#5F6384;font-size:14px;padding:10px","Is hisse me koi question nahi.");list.appendChild(e);return;}
    arr.forEach(function(i){
      var q=S.qs[i];
      var c=E("div","display:flex;flex-direction:column;gap:10px;padding:16px");c.className="cd";
      c.appendChild(E("div","font-size:14px;font-weight:700","Q."+q.n+" · "+q.s+"  |  Aapka jawab: "+(S.ans[i]?"("+S.ans[i]+")":"chhoda")+"  |  Sahi jawab: "+(q.a&&q.a.length?q.a.map(function(x){return "("+x+")";}).join(" ya "):"-")));
      var im=E("img");im.className="qi";im.src=q.img;c.appendChild(im);
      list.appendChild(c);
    });
  }
  [["Galat ("+tot.w+")",wrong],["Chhode ("+tot.s+")",skip],["Sahi ("+tot.c+")",right]].forEach(function(t){
    var b=E("button","min-height:42px;padding:0 16px;background:#fff;color:#4F46E5;box-shadow:inset 0 0 0 2px #4F46E5",t[0]);
    b.className="btn";b.onclick=function(){showList(t[1],t[0]);};tabs.appendChild(b);
  });
